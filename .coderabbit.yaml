# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
reviews:
  profile: "chill"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  assess_linked_issues: true
  auto_review:
    enabled: true
    drafts: false
  path_instructions:
    - path: "**"
      instructions: "Check the PR against the linked issue's acceptance criteria and say whether it is in scope."
    - path: "{internal/measure/**,internal/scheduler/**,internal/store/**}"
      instructions: "Changes to threshold, loss calculation, or state-transition logic must include tests."
    - path: "{go.mod,go.sum}"
      instructions: "Flag new dependencies."
    - path: "docs/corridor-verification.md"
      instructions: "Flag edits that lack verification evidence."
  pre_merge_checks:
    issue_assessment:
      mode: "warning"
